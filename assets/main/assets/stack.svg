<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <defs>
    <pattern id="checker2" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1E2BFF"/>
      <rect x="8" y="8" width="8" height="8" fill="#1E2BFF"/>
    </pattern>
    <pattern id="lines" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#1E2BFF" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="600" fill="#F2EFEA"/>

  <!-- ===== 左上 UNITY 大字块 ===== -->
  <rect x="40" y="40" width="380" height="170" fill="#1E2BFF"/>
  <!-- UNITY 主大字 -->
  <text x="60" y="125" font-family="Impact" font-weight="900" font-size="84" fill="#F2EFEA" letter-spacing="-3">UNITY</text>
  <!-- URP/HDRP 缩小 + 独立行 -->
  <text x="60" y="170" font-family="Courier New" font-weight="bold" font-size="22" fill="#F2EFEA" letter-spacing="2">URP / HDRP</text>
  <!-- 装饰线 -->
  <line x1="60" y1="186" x2="360" y2="186" stroke="#F2EFEA" stroke-width="1" opacity="0.6"/>
  <text x="60" y="200" font-family="Courier New" font-size="11" fill="#F2EFEA" opacity="0.7">// engine_01</text>

  <!-- ===== 竖排 UNREAL ===== -->
  <text x="430" y="80" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-2">U</text>
  <text x="430" y="120" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-2">N</text>
  <text x="430" y="160" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-2">R</text>
  <text x="430" y="200" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-2">E</text>
  <text x="430" y="240" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-2">A</text>
  <text x="430" y="280" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-2">L</text>
  <text x="430" y="305" font-family="Courier New" font-size="11" fill="#1E2BFF" opacity="0.7">5</text>

  <!-- ===== HLSL LIVE 块 ===== -->
  <text x="500" y="100" font-family="Impact" font-weight="900" font-size="68" fill="#1E2BFF" letter-spacing="-2">HLSL</text>
  <text x="780" y="80" font-family="Courier New" font-weight="bold" font-size="18" fill="#1E2BFF">LIVE</text>
  <!-- HLSL 下波浪线 -->
  <g transform="translate(500,120)">
    <rect width="280" height="4" fill="#1E2BFF"/>
    <rect y="14" width="260" height="3" fill="#1E2BFF"/>
    <rect y="26" width="240" height="2" fill="#1E2BFF"/>
  </g>

  <!-- ===== SHADER GRAPH 大字 ===== -->
  <rect x="40" y="240" width="280" height="80" fill="#1E2BFF"/>
  <text x="60" y="296" font-family="Impact" font-weight="900" font-size="44" fill="#F2EFEA" letter-spacing="-1">SHADER</text>
  <text x="330" y="296" font-family="Impact" font-weight="900" font-size="44" fill="#1E2BFF" letter-spacing="-1">GRAPH</text>
  <rect x="540" y="252" width="40" height="50" fill="#1E2BFF"/>
  <text x="560" y="290" text-anchor="middle" font-family="Impact" font-weight="900" font-size="36" fill="#F2EFEA">X</text>

  <!-- ===== RENDER FX 块 ===== -->
  <rect x="40" y="350" width="240" height="70" fill="#1E2BFF"/>
  <text x="60" y="402" font-family="Impact" font-weight="900" font-size="42" fill="#F2EFEA" letter-spacing="-1">RENDER</text>
  <rect x="290" y="350" width="80" height="70" fill="#1E2BFF"/>
  <text x="330" y="402" text-anchor="middle" font-family="Impact" font-weight="900" font-size="42" fill="#F2EFEA">FX</text>

  <!-- 棋盘格小图 -->
  <rect x="600" y="160" width="220" height="140" fill="url(#checker2)" opacity="0.4"/>
  <rect x="620" y="180" width="180" height="100" fill="#F2EFEA"/>
  <rect x="640" y="200" width="140" height="60" fill="url(#lines)"/>

  <!-- ===== C++ / C# 块 ===== -->
  <text x="40" y="500" font-family="Impact" font-weight="900" font-size="84" fill="#1E2BFF" letter-spacing="-3">C++</text>
  <text x="40" y="560" font-family="Impact" font-weight="900" font-size="56" fill="#1E2BFF" letter-spacing="-2">C#</text>

  <!-- ===== PYTHON 电路风 ===== -->
  <g transform="translate(280,470)">
    <text font-family="Impact" font-weight="900" font-size="42" fill="#1E2BFF" letter-spacing="-1">PYTHON</text>
    <path d="M0,40 L40,40 L50,30 L100,30 L110,40 L160,40" stroke="#1E2BFF" stroke-width="2" fill="none"/>
    <circle cx="0" cy="40" r="4" fill="#1E2BFF"/>
    <circle cx="160" cy="40" r="4" fill="#1E2BFF"/>
    <rect x="55" y="20" width="40" height="20" fill="none" stroke="#1E2BFF" stroke-width="2"/>
  </g>

  <!-- ===== HOUDINI 像素故障 ===== -->
  <g transform="translate(560,440)">
    <text font-family="Impact" font-weight="900" font-size="48" fill="#1E2BFF" letter-spacing="-1">HOUDINI</text>
    <text y="-2" font-family="Impact" font-weight="900" font-size="48" fill="#1E2BFF" letter-spacing="-1" opacity="0.4">HOUDINI</text>
  </g>

  <!-- ===== HYPER COLOUR 大块 ===== -->
  <rect x="900" y="40" width="460" height="280" fill="#F2EFEA" stroke="#1E2BFF" stroke-width="2"/>
  <text x="920" y="100" font-family="Impact" font-weight="900" font-size="52" fill="#1E2BFF" letter-spacing="-2">HYPER</text>
  <text x="1180" y="100" font-family="Impact" font-weight="900" font-size="52" fill="#1E2BFF" letter-spacing="-2" transform="rotate(90 1180 100)">COLOUR</text>
  <circle cx="1080" cy="220" r="80" fill="none" stroke="#1E2BFF" stroke-width="2"/>
  <rect x="1020" y="160" width="120" height="120" fill="none" stroke="#1E2BFF" stroke-width="2"/>
  <g transform="translate(1080,220)">
    <rect x="-30" y="-30" width="60" height="60" fill="#1E2BFF" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== PBR.EXT ===== -->
  <rect x="900" y="340" width="220" height="70" fill="url(#checker2)" opacity="0.5"/>
  <rect x="920" y="350" width="180" height="50" fill="#F2EFEA"/>
  <text x="930" y="388" font-family="Impact" font-weight="900" font-size="36" fill="#1E2BFF">PBR.EXT</text>

  <!-- ===== 右下工具链 ===== -->
  <text x="900" y="470" font-family="Impact" font-weight="900" font-size="42" fill="#1E2BFF" letter-spacing="-1">BLENDER</text>
  <text x="900" y="520" font-family="Impact" font-weight="900" font-size="42" fill="#0a0a0a" letter-spacing="-1">SUBSTANCE</text>
  <text x="900" y="570" font-family="Impact" font-weight="900" font-size="42" fill="#1E2BFF" letter-spacing="-1">GIT · RIDER · VS</text>

  <!-- 棋盘格细条 -->
  <rect x="0" y="0" width="40" height="600" fill="url(#checker2)" opacity="0.25"/>
  <rect x="1360" y="0" width="40" height="600" fill="url(#checker2)" opacity="0.25"/>

  <!-- 旋转大星芒 -->
  <g transform="translate(820,400)">
    <path d="M0,-50 L10,-10 L50,0 L10,10 L0,50 L-10,10 L-50,0 L-10,-10 Z" fill="#1E2BFF">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(1320,560)">
    <path d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4 Z" fill="#0a0a0a">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
