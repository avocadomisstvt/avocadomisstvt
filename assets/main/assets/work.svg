<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 240" width="1400" height="240">
  <defs>
    <pattern id="checker3" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#1E2BFF" opacity="0.2"/>
      <rect x="7" y="7" width="7" height="7" fill="#1E2BFF" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1400" height="240" fill="#F2EFEA"/>
  <rect x="0" y="0" width="1400" height="240" fill="url(#checker3)"/>

  <!-- 中心放射蓝色三角束 -->
  <g transform="translate(700,120)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <polygon points="0,0 -300,-30 -310,30" fill="#1E2BFF" opacity="0.85"/>
      <polygon points="0,0 300,-30 310,30" fill="#1E2BFF" opacity="0.85"/>
      <polygon points="0,0 -30,-200 30,-210" fill="#1E2BFF" opacity="0.7"/>
      <polygon points="0,0 -30,200 30,210" fill="#1E2BFF" opacity="0.7"/>
      <polygon points="0,0 -200,-160 -180,-180" fill="#1E2BFF" opacity="0.5"/>
      <polygon points="0,0 200,160 180,180" fill="#1E2BFF" opacity="0.5"/>
      <polygon points="0,0 200,-160 180,-180" fill="#1E2BFF" opacity="0.5"/>
      <polygon points="0,0 -200,160 -180,180" fill="#1E2BFF" opacity="0.5"/>
    </g>
  </g>

  <!-- 中心 WORK 大字 -->
  <text x="700" y="135" text-anchor="middle" font-family="Impact" font-weight="900" font-size="80" fill="#F2EFEA" letter-spacing="-3" stroke="#0a0a0a" stroke-width="1">#WORK.</text>

  <!-- 左上小图标群 -->
  <text x="40" y="40" font-family="Courier New" font-size="11" fill="#0a0a0a">53.7346°N, 10.1648°E</text>
  <text x="40" y="220" font-family="Courier New" font-size="11" fill="#0a0a0a">54.2144°N, 8.7567°E</text>

  <!-- 旋转星芒 -->
  <g transform="translate(140,60)">
    <path d="M0,-30 L6,-6 L30,0 L6,6 L0,30 L-6,6 L-30,0 L-6,-6 Z" fill="#1E2BFF">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(1260,180)">
    <path d="M0,-30 L6,-6 L30,0 L6,6 L0,30 L-6,6 L-30,0 L-6,-6 Z" fill="#0a0a0a">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(1340,60)">
    <path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z" fill="#1E2BFF">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 闪烁 STOP 标签 -->
  <g transform="translate(60,160)">
    <polygon points="0,0 60,0 60,30 0,30" fill="#0a0a0a"/>
    <text x="30" y="20" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="12" fill="#F2EFEA">STOP</text>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- 像素图块 -->
  <g transform="translate(1280,30)">
    <rect width="10" height="10" fill="#1E2BFF"/>
    <rect x="14" y="0" width="10" height="10" fill="#1E2BFF"/>
    <rect x="0" y="14" width="10" height="10" fill="#1E2BFF" opacity="0.5"/>
    <rect x="14" y="14" width="10" height="10" fill="#1E2BFF"/>
  </g>
</svg>
