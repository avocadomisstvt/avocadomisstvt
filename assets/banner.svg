<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" width="1400" height="540">
  <defs>

    <!-- 棋盘格 -->
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1E2BFF" opacity="0.18"/>
      <rect x="10" y="10" width="10" height="10" fill="#1E2BFF" opacity="0.18"/>
    </pattern>

    <!-- CRT 扫描线 -->
    <pattern id="scanline" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1.5" fill="#000000" opacity="0.22"/>
    </pattern>

    <!-- 键盘按键纹理 -->
    <pattern id="keyPattern" x="0" y="0" width="13" height="10" patternUnits="userSpaceOnUse">
      <rect width="11" height="8" rx="1.5" fill="#3a3530" stroke="#555" stroke-width="0.5"/>
    </pattern>

    <!-- 散热孔横条 -->
    <pattern id="ventSlot" x="0" y="0" width="1" height="7" patternUnits="userSpaceOnUse">
      <rect y="1" width="1" height="4" fill="#888" opacity="0.6"/>
    </pattern>

    <!-- 故障滤镜 -->
    <filter id="glitch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="5" result="noise">
        <animate attributeName="baseFrequency" values="0.008;0.05;0.008" dur="6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>

    <!-- 屏幕辉光 -->
    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 扫光 -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E2BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1E2BFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1E2BFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 机身渐变 -->
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dedad2"/>
      <stop offset="0.3" stop-color="#ccc8c0"/>
      <stop offset="1" stop-color="#b0aca4"/>
    </linearGradient>
    <linearGradient id="bodyFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c4bc"/>
      <stop offset="1" stop-color="#a8a49c"/>
    </linearGradient>

    <!-- 屏幕背景 -->
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060e06"/>
      <stop offset="1" stop-color="#020802"/>
    </linearGradient>

    <!-- CRT 玻璃反光 -->
    <radialGradient id="crtShine" cx="0.28" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 磁带盘渐变 -->
    <radialGradient id="reelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a3530"/>
      <stop offset="0.6" stop-color="#1a1510"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- 按键高光 -->
    <linearGradient id="keyShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555" stop-opacity="1"/>
      <stop offset="1" stop-color="#222" stop-opacity="1"/>
    </linearGradient>

  </defs>

  <!-- ===================== 背景 ===================== -->
  <rect width="1400" height="540" fill="#F2EFEA"/>

  <!-- 背景斜线 -->
  <line x1="0" y1="0" x2="1400" y2="180" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="40" x2="900" y2="0" stroke="#0a0a0a" stroke-width="1" opacity="0.15"/>

  <!-- 顶部坐标 -->
  <text x="40" y="28" font-family="Courier New" font-size="11" fill="#0a0a0a" opacity="0.65">
    53.7346,10.1648  //  78.6518,16.4017  //  59.9886,6.2643  //  46.0312,12.7704  //  54.2144,8.7567
  </text>

  <!-- 主大蓝块 -->
  <rect x="180" y="100" width="720" height="360" fill="#1E2BFF"/>

  <!-- 蓝块内棋盘格小窗 -->
  <rect x="220" y="140" width="180" height="120" fill="#F2EFEA"/>
  <rect x="236" y="156" width="148" height="88" fill="url(#grid)"/>

  <!-- 蓝块内黑标签 -->
  <rect x="220" y="278" width="130" height="32" fill="#0a0a0a"/>
  <text x="285" y="299" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="13" fill="#F2EFEA">IBM 5100</text>

  <!-- {XML}.COMPUTER 标签 -->
  <rect x="180" y="68" width="220" height="28" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="290" y="88" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="14" fill="#0a0a0a">{XML}.COMPUTER</text>

  <!-- [+] 黑标 -->
  <rect x="820" y="68" width="50" height="50" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="845" y="102" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="22" fill="#0a0a0a">[+]</text>


  <!-- ===================== IBM 5100 主机 ===================== -->
  <!--
    参考图特征：
    - 整机横向扁平，宽约高的2.5倍
    - 上半部分：左侧CRT屏幕 + 右侧磁带驱动器 + 右侧控制面板
    - 下半部分：全宽键盘，按键密集
    - 机身颜色：米黄/奶油色
    - 屏幕：深色边框，绿磷光
    - 磁带驱动器：两个圆形盘窗，在屏幕右侧
  -->
  <g transform="translate(430,108)">

    <!-- 整机浮动 -->
    <animateTransform attributeName="transform" type="translate"
      values="430,108; 430,101; 430,108" dur="5s" repeatCount="indefinite"/>

    <!-- ===== 机身底部阴影 ===== -->
    <ellipse cx="210" cy="322" rx="205" ry="10" fill="#0a0a0a" opacity="0.2"/>

    <!-- ===== 机身主体外壳 ===== -->
    <!-- 顶面(透视感) -->
    <polygon points="10,0 410,0 420,12 0,12" fill="#dedad2"/>
    <!-- 左侧面 -->
    <polygon points="0,12 10,0 10,310 0,322" fill="#b8b4ac"/>
    <!-- 右侧面 -->
    <polygon points="410,0 420,12 420,322 410,310" fill="#a0a098"/>
    <!-- 正面主体 -->
    <rect x="0" y="12" width="410" height="310" rx="0" fill="url(#bodyFront)"/>
    <!-- 正面顶部高光条 -->
    <rect x="0" y="12" width="410" height="4" fill="#d8d4cc"/>

    <!-- ===== 上半区域分割线 ===== -->
    <!-- 上半区背景(略深) -->
    <rect x="8" y="20" width="394" height="168" rx="2" fill="#b8b4ac"/>

    <!-- ===== CRT 显示屏 (左上，约占上半区左2/3) ===== -->
    <!-- 屏幕外框 -->
    <rect x="14" y="26" width="230" height="156" rx="4" fill="#1e1c18" stroke="#888" stroke-width="1.5"/>
    <!-- 屏幕内凹边 -->
    <rect x="18" y="30" width="222" height="148" rx="3" fill="#161410"/>
    <!-- CRT 玻璃屏 -->
    <rect x="22" y="34" width="214" height="140" rx="8" fill="url(#screenBg)"/>

    <!-- 屏幕内容 (绿磷光) -->
    <g filter="url(#screenGlow)">
      <text x="32" y="56" font-family="Courier New" font-size="9.5" fill="#00FF41">IBM 5100 PORTABLE COMPUTER</text>
      <text x="32" y="70" font-family="Courier New" font-size="9.5" fill="#00CC33">COPYRIGHT IBM CORP. 1975</text>
      <text x="32" y="84" font-family="Courier New" font-size="9.5" fill="#00CC33">APL/BASIC  48K BYTES</text>
      <line x1="32" y1="90" x2="222" y2="90" stroke="#00FF41" stroke-width="0.5" opacity="0.35"/>
      <text x="32" y="104" font-family="Courier New" font-size="9.5" fill="#00FF41">READY</text>
      <text x="32" y="118" font-family="Courier New" font-size="9.5" fill="#00FF41">&gt; AVOCADO.TA_</text>
      <!-- 光标闪烁 -->
      <rect x="136" y="107" width="6" height="11" fill="#00FF41">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="32" y="136" font-family="Courier New" font-size="9" fill="#009922" opacity="0.9">SHADER  TOOLING  PIPELINE</text>
      <text x="32" y="150" font-family="Courier New" font-size="9" fill="#009922" opacity="0.9">DATA 80%  :  BIO 20%</text>
      <text x="32" y="164" font-family="Courier New" font-size="8.5" fill="#00FF41" opacity="0.55">53.7346N 10.1648E  SYS_OK</text>
    </g>

    <!-- 扫描线叠加 -->
    <rect x="22" y="34" width="214" height="140" rx="8" fill="url(#scanline)" opacity="0.55"/>
    <!-- CRT 玻璃反光 -->
    <rect x="22" y="34" width="214" height="140" rx="8" fill="url(#crtShine)"/>
    <!-- 屏幕边框蓝色装饰线 -->
    <rect x="22" y="34" width="214" height="140" rx="8" fill="none" stroke="#1E2BFF" stroke-width="0.8" opacity="0.5"/>

    <!-- 屏幕下方型号标 -->
    <text x="129" y="186" text-anchor="middle" font-family="Courier New" font-size="7" fill="#666">IBM 5100</text>

    <!-- ===== 磁带驱动器区域 (屏幕右侧) ===== -->
    <!-- 驱动器外框 -->
    <rect x="252" y="26" width="150" height="156" rx="3" fill="#1e1c18" stroke="#777" stroke-width="1.5"/>
    <!-- 驱动器内腔 -->
    <rect x="258" y="32" width="138" height="144" rx="2" fill="#141210"/>

    <!-- 磁带盒插槽上方标签 -->
    <text x="327" y="46" text-anchor="middle" font-family="Courier New" font-size="7" fill="#888">TAPE DRIVE</text>

    <!-- 磁带盒插槽 -->
    <rect x="264" y="50" width="126" height="80" rx="2" fill="#0a0a0a" stroke="#333" stroke-width="1"/>

    <!-- 磁带盒本体 -->
    <rect x="270" y="56" width="114" height="68" rx="2" fill="#1E2BFF" opacity="0.9"/>
    <!-- 磁带盒标签纸 -->
    <rect x="276" y="60" width="102" height="40" rx="1" fill="#F2EFEA"/>
    <text x="327" y="72" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="7.5" fill="#0a0a0a">IBM 5100</text>
    <text x="327" y="82" text-anchor="middle" font-family="Courier New" font-size="6.5" fill="#333">APL PROGRAM TAPE</text>
    <text x="327" y="92" text-anchor="middle" font-family="Courier New" font-size="6" fill="#1E2BFF">SIDE A  ///  48K</text>
    <!-- 标签装饰线 -->
    <line x1="280" y1="96" x2="374" y2="96" stroke="#1E2BFF" stroke-width="0.8"/>

    <!-- 磁带窗口区域 -->
    <rect x="276" y="100" width="102" height="18" rx="1" fill="#0a0a0a"/>

    <!-- 左磁带盘 -->
    <g transform="translate(305,109)">
      <!-- 外圈 -->
      <circle r="14" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
      <!-- 中圈 -->
      <circle r="10" fill="url(#reelGrad)"/>
      <!-- 辐条 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
        <line x1="0" y1="-8" x2="0" y2="-3" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="8" x2="0" y2="3" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="0" x2="-3" y2="0" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="0" x2="3" y2="0" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="-6" y1="-6" x2="-2" y2="-2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="6" y1="6" x2="2" y2="2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-6" y1="6" x2="-2" y2="2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="6" y1="-6" x2="2" y2="-2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <!-- 中心轴 -->
      <circle r="3" fill="#1a1510" stroke="#555" stroke-width="0.5"/>
      <circle r="1.2" fill="#444"/>
    </g>

    <!-- 右磁带盘 -->
    <g transform="translate(349,109)">
      <circle r="14" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
      <circle r="10" fill="url(#reelGrad)"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.5s" repeatCount="indefinite"/>
        <line x1="0" y1="-8" x2="0" y2="-3" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="8" x2="0" y2="3" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="0" x2="-3" y2="0" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="0" x2="3" y2="0" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="-6" y1="-6" x2="-2" y2="-2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="6" y1="6" x2="2" y2="2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="6" y1="-6" x2="2" y2="-2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-6" y1="6" x2="-2" y2="2" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <circle r="3" fill="#1a1510" stroke="#555" stroke-width="0.5"/>
      <circle r="1.2" fill="#444"/>
    </g>

    <!-- 驱动器按钮行 -->
    <!-- LOAD 按钮 -->
    <rect x="264" y="136" width="38" height="14" rx="2" fill="#c8c4bc" stroke="#888" stroke-width="1"/>
    <text x="283" y="146" text-anchor="middle" font-family="Courier New" font-size="6.5" fill="#333">LOAD</text>
    <!-- UNLOAD 按钮 -->
    <rect x="306" y="136" width="44" height="14" rx="2" fill="#c8c4bc" stroke="#888" stroke-width="1"/>
    <text x="328" y="146" text-anchor="middle" font-family="Courier New" font-size="6.5" fill="#333">UNLOAD</text>
    <!-- REWIND 按钮 -->
    <rect x="354" y="136" width="38" height="14" rx="2" fill="#c8c4bc" stroke="#888" stroke-width="1"/>
    <text x="373" y="146" text-anchor="middle" font-family="Courier New" font-size="6.5" fill="#333">REWIND</text>

    <!-- 驱动器指示灯 -->
    <circle cx="270" cy="158" r="4" fill="#00FF41">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="278" y="161" font-family="Courier New" font-size="6" fill="#888">READY</text>
    <circle cx="316" cy="158" r="4" fill="#FF8C00">
      <animate attributeName="opacity" values="0.2;1;0.2;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="324" y="161" font-family="Courier New" font-size="6" fill="#888">BUSY</text>
    <circle cx="356" cy="158" r="4" fill="#FF2020" opacity="0.3"/>
    <text x="364" y="161" font-family="Courier New" font-size="6" fill="#888">ERR</text>

    <!-- 驱动器散热孔 -->
    <rect x="264" y="166" width="126" height="8" fill="url(#ventSlot)"/>

    <!-- ===== 右侧控制面板 ===== -->
    <!-- 控制面板背景 -->
    <rect x="8" y="26" width="0" height="0"/>
    <!-- 注：IBM 5100 屏幕左侧有一列控制键 -->

    <!-- ===== 机身中部分割槽 ===== -->
    <rect x="8" y="192" width="394" height="4" fill="#9a9690"/>
    <rect x="8" y="194" width="394" height="2" fill="#d0ccc4"/>

    <!-- ===== 键盘区域 (下半部分，参考图中占大部分) ===== -->
    <!-- 键盘背板 -->
    <rect x="8" y="198" width="394" height="108" rx="2" fill="#b0aca4"/>

    <!-- 键盘顶部功能键区 -->
    <!-- 第一行：功能键 F1-F16 + 特殊键 -->
    <g transform="translate(14,204)">
      <!-- F1 -->
      <rect x="0" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="9" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F1</text>
      <!-- F2 -->
      <rect x="21" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="30" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F2</text>
      <!-- F3 -->
      <rect x="42" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="51" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F3</text>
      <!-- F4 -->
      <rect x="63" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="72" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F4</text>
      <!-- F5 -->
      <rect x="84" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="93" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F5</text>
      <!-- F6 -->
      <rect x="105" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="114" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F6</text>
      <!-- F7 -->
      <rect x="126" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="135" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F7</text>
      <!-- F8 -->
      <rect x="147" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="156" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F8</text>
      <!-- 间隔 -->
      <!-- F9 -->
      <rect x="174" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="183" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F9</text>
      <!-- F10 -->
      <rect x="195" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="204" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F10</text>
      <!-- F11 -->
      <rect x="216" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="225" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F11</text>
      <!-- F12 -->
      <rect x="237" y="0" width="18" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="246" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">F12</text>
      <!-- EXEC 蓝键 -->
      <rect x="264" y="0" width="28" height="13" rx="1.5" fill="#1E2BFF" stroke="#0a0a0a" stroke-width="0.5"/>
      <text x="278" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#F2EFEA">EXEC</text>
      <!-- ATTN 红键 -->
      <rect x="296" y="0" width="28" height="13" rx="1.5" fill="#8B0000" stroke="#0a0a0a" stroke-width="0.5"/>
      <text x="310" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#F2EFEA">ATTN</text>
      <!-- CMD 键 -->
      <rect x="328" y="0" width="28" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="342" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">CMD</text>
      <!-- HOLD 键 -->
      <rect x="360" y="0" width="28" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="374" y="10" text-anchor="middle" font-family="Courier New" font-size="5.5" fill="#ccc">HOLD</text>
    </g>

    <!-- 第二行：数字键 + 符号键 -->
    <g transform="translate(14,220)">
      <!-- TAB -->
      <rect x="0" y="0" width="26" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      <text x="13" y="10" text-anchor="middle" font-family="Courier New" font-size="5" fill="#ccc">TAB</text>
      <!-- 1 ~ 0 数字键 -->
      <rect x="29" y="0" width="13" height="13" rx="1.5" fill="url(#keyShine)" stroke="#666" stroke-width="0.5"/>
      
