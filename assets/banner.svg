<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" width="1400" height="540">
  <defs>
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1E2BFF" opacity="0.18"/>
      <rect x="10" y="10" width="10" height="10" fill="#1E2BFF" opacity="0.18"/>
    </pattern>
    <pattern id="lensGrid" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0a0a0a"/>
      <circle cx="3" cy="3" r="1" fill="#1E2BFF" opacity="0.6"/>
    </pattern>
    <filter id="glitch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="5" result="noise">
        <animate attributeName="baseFrequency" values="0.008;0.05;0.008" dur="6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E2BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1E2BFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1E2BFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lensRG" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#F2EFEA"/>
      <stop offset="0.4" stop-color="#1E2BFF"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <!-- 米白底 -->
  <rect width="1400" height="540" fill="#F2EFEA"/>

  <!-- 顶部细斜线 -->
  <line x1="0" y1="0" x2="1400" y2="180" stroke="#0a0a0a" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="40" x2="900" y2="0" stroke="#0a0a0a" stroke-width="1" opacity="0.18"/>

  <!-- 顶部坐标 -->
  <text x="40" y="30" font-family="Courier New" font-size="11" fill="#0a0a0a" opacity="0.7">
    53.7346,10.1648  //  78.6518,16.4017  //  59.9886,6.2643  //  46.0312,12.7704  //  54.2144,8.7567
  </text>

  <!-- 主大蓝块 -->
  <rect x="180" y="100" width="720" height="360" fill="#1E2BFF"/>

  <!-- 蓝块内的棋盘格小窗 -->
  <rect x="220" y="140" width="200" height="140" fill="#F2EFEA"/>
  <rect x="240" y="160" width="160" height="100" fill="url(#grid)"/>

  <!-- 蓝块内的黑色小标签 -->
  <rect x="220" y="300" width="100" height="36" fill="#0a0a0a"/>
  <text x="270" y="324" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="14" fill="#F2EFEA">REC.</text>

  <!-- {XML}.CAM 标签 -->
  <g transform="translate(180,70)">
    <rect width="180" height="28" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="14" fill="#0a0a0a">{XML}.CAMERA</text>
  </g>

  <!-- [ + ] 黑标 -->
  <g transform="translate(820,70)">
    <rect width="50" height="50" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="25" y="34" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="22" fill="#0a0a0a">[+]</text>
  </g>

  <!-- ============ 录像机 / 摄影机 ============ -->
  <g transform="translate(560,150)">
    <!-- 整体轻微浮动 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="4s" repeatCount="indefinite"/>

      <!-- 顶部录像带仓 -->
      <rect x="40" y="0" width="220" height="60" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="3"/>
      <!-- 顶部两个胶卷盘 -->
      <circle cx="90" cy="30" r="20" fill="#0a0a0a"/>
      <circle cx="90" cy="30" r="14" fill="#F2EFEA"/>
      <circle cx="90" cy="30" r="4" fill="#0a0a0a"/>
      <g transform="translate(90,30)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
          <line x1="-12" y1="0" x2="12" y2="0" stroke="#0a0a0a" stroke-width="2"/>
          <line x1="0" y1="-12" x2="0" y2="12" stroke="#0a0a0a" stroke-width="2"/>
          <line x1="-9" y1="-9" x2="9" y2="9" stroke="#0a0a0a" stroke-width="2"/>
        </g>
      </g>
      <circle cx="210" cy="30" r="20" fill="#0a0a0a"/>
      <circle cx="210" cy="30" r="14" fill="#F2EFEA"/>
      <circle cx="210" cy="30" r="4" fill="#0a0a0a"/>
      <g transform="translate(210,30)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
          <line x1="-12" y1="0" x2="12" y2="0" stroke="#0a0a0a" stroke-width="2"/>
          <line x1="0" y1="-12" x2="0" y2="12" stroke="#0a0a0a" stroke-width="2"/>
          <line x1="-9" y1="9" x2="9" y2="-9" stroke="#0a0a0a" stroke-width="2"/>
        </g>
      </g>
      <!-- REC 标签 -->
      <rect x="135" y="20" width="40" height="20" fill="#0a0a0a"/>
      <circle cx="145" cy="30" r="4" fill="#1E2BFF">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="166" y="34" font-family="Courier New" font-weight="bold" font-size="11" fill="#F2EFEA">REC</text>

      <!-- 主机身 -->
      <rect x="0" y="60" width="300" height="160" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="3"/>
      <!-- 机身上的格栅 -->
      <g transform="translate(20,80)">
        <line x1="0" y1="0" x2="80" y2="0" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="0" y1="6" x2="80" y2="6" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="0" y1="12" x2="80" y2="12" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="0" y1="18" x2="80" y2="18" stroke="#0a0a0a" stroke-width="1"/>
        <line x1="0" y1="24" x2="80" y2="24" stroke="#0a0a0a" stroke-width="1"/>
      </g>
      <!-- 机身上的按钮和屏幕 -->
      <rect x="20" y="120" width="80" height="50" fill="#0a0a0a"/>
      <text x="60" y="140" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="10" fill="#1E2BFF">CH 01</text>
      <text x="60" y="156" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="14" fill="#F2EFEA">00:00:42</text>
      <!-- 圆形按钮 -->
      <circle cx="30" cy="190" r="6" fill="#1E2BFF"/>
      <circle cx="50" cy="190" r="6" fill="#0a0a0a"/>
      <circle cx="70" cy="190" r="6" fill="#0a0a0a"/>
      <circle cx="90" cy="190" r="6" fill="#0a0a0a"/>

      <!-- 镜头大圆环 -->
      <circle cx="220" cy="140" r="62" fill="#0a0a0a"/>
      <circle cx="220" cy="140" r="56" fill="#F2EFEA" stroke="#0a0a0a" stroke-width="2"/>
      <circle cx="220" cy="140" r="48" fill="url(#lensRG)"/>
      <circle cx="220" cy="140" r="34" fill="#0a0a0a"/>
      <circle cx="220" cy="140" r="22" fill="#1E2BFF"/>
      <circle cx="220" cy="140" r="10" fill="#0a0a0a"/>
      <!-- 镜头高光 -->
      <ellipse cx="208" cy="128" rx="10" ry="6" fill="#F2EFEA" opacity="0.6"/>
      <!-- 旋转的光圈刻度 -->
      <g transform="translate(220,140)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
          <line x1="0" y1="-58" x2="0" y2="-50" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="0" y1="58" x2="0" y2="50" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="-58" y1="0" x2="-50" y2="0" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="58" y1="0" x2="50" y2="0" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="-41" y1="-41" x2="-35" y2="-35" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="41" y1="41" x2="35" y2="35" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="-41" y1="41" x2="-35" y2="35" stroke="#1E2BFF" stroke-width="2"/>
          <line x1="41" y1="-41" x2="35" y2="-35" stroke="#1E2BFF" stroke-width="2"/>
        </g>
      </g>

      <!-- 麦克风 -->
      <rect x="270" y="40" width="14" height="6" fill="#0a0a0a"/>
      <rect x="278" y="46" width="6" height="20" fill="#0a0a0a"/>
      <rect x="270" y="66" width="20" height="40" fill="url(#lensGrid)" stroke="#0a0a0a" stroke-width="2"/>

      <!-- 把手 -->
      <rect x="120" y="-25" width="60" height="8" fill="#0a0a0a"/>
      <rect x="138" y="-17" width="24" height="17" fill="#0a0a0a"/>

      <!-- 三脚架 -->
      <rect x="145" y="220" width="10" height="40" fill="#0a0a0a"/>
      <line x1="150" y1="260" x2="100" y2="300" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="150" y1="260" x2="200" y2="300" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="150" y1="260" x2="150" y2="300" stroke="#0a0a0a" stroke-width="3"/>
    </g>
  </g>

  <!-- 主标题 AVOCADO 故障字 -->
  <g transform="translate(180,400)">
    <text font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="100" fill="#F2EFEA" filter="url(#glitch)" letter-spacing="-3">AVOCADO</text>
  </g>

  <!-- 副标 -->
  <text x="180" y="448" font-family="Courier New" font-size="14" fill="#F2EFEA" letter-spacing="3">// TECHNICAL_ARTIST :: SHADER · TOOLING · PIPELINE</text>

  <!-- DATA 黑色标签 -->
  <g transform="translate(940,360)">
    <rect width="280" height="34" fill="#0a0a0a"/>
    <text x="14" y="23" font-family="Courier New" font-weight="bold" font-size="14" fill="#F2EFEA">DATA 80% : BIOLOGICAL 20%</text>
  </g>

  <!-- #Work. 大字 -->
  <text x="940" y="220" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="68" fill="#0a0a0a">#Work.</text>
  <text x="940" y="252" font-family="Courier New" font-size="13" fill="#0a0a0a">Consisting of three short novels:</text>
  <text x="940" y="272" font-family="Courier New" font-size="13" fill="#0a0a0a" opacity="0.7">_shader / _tooling / _pipeline</text>

  <!-- 大星芒右下 -->
  <g transform="translate(1280,160)">
    <path d="M0,-40 L8,-8 L40,0 L8,8 L0,40 L-8,8 L-40,0 L-8,-8 Z" fill="#0a0a0a">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小星芒 ×3 -->
  <g transform="translate(1080,80)">
    <path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z" fill="#1E2BFF">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(1340,440)">
    <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#1E2BFF">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(60,440)">
    <path d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4 Z" fill="#0a0a0a">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 扫光横线 -->
  <rect x="0" y="100" width="1400" height="2" fill="url(#beam)" opacity="0.8">
    <animate attributeName="y" values="100;480;100" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- 脉冲圆点 -->
  <circle cx="900" cy="280" r="6" fill="#1E2BFF">
    <animate attributeName="r" values="6;16;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 底部 @ExplTion -->
  <text x="40" y="520" font-family="Courier New" font-weight="bold" font-size="22" fill="#1E2BFF">@.ExplTion :</text>
  <text x="220" y="520" font-family="Courier New" font-size="14" fill="#0a0a0a">bridging_art × engineering — consisting of three short novels</text>

  <!-- 底部装饰小方块 -->
  <rect x="1340" y="500" width="20" height="20" fill="#1E2BFF"/>
  <rect x="1370" y="510" width="10" height="10" fill="#0a0a0a"/>
</svg>
