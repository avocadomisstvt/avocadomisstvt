<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380">
  <defs>
    <!-- 棋盘格 -->
    <pattern id="ck" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#1E2BFF" opacity="0.18"/>
      <rect x="7" y="7" width="7" height="7" fill="#1E2BFF" opacity="0.18"/>
    </pattern>
    <pattern id="ckSolid" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#1E2BFF"/>
      <rect x="6" y="6" width="6" height="6" fill="#1E2BFF"/>
    </pattern>
    <!-- 像素颗粒纹理 -->
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#1E2BFF" opacity="0.4"/>
    </pattern>
    <!-- 条纹 -->
    <pattern id="stripe" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#1E2BFF" stroke-width="1"/>
    </pattern>
    <!-- 故障/置换噪声 -->
    <filter id="distort">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <!-- 半色调 -->
    <pattern id="halftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#1E2BFF"/>
    </pattern>
  </defs>

