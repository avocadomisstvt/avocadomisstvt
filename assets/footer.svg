<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 200" width="1400" height="200">
  <rect width="1400" height="200" fill="#F2EFEA"/>

  <!-- 大蓝块 -->
  <rect x="0" y="40" width="1400" height="120" fill="#1E2BFF"/>

  <!-- 大故障字 -->
  <defs>
    <filter id="footerGlitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9">
        <animate attributeName="baseFrequency" values="0.01;0.06;0.01" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>

  <text x="700" y="125" text-anchor="middle" font-family="Impact" font-weight="900" font-size="74" fill="#F2EFEA" letter-spacing="-3" filter="url(#footerGlitch)">@.ExplTion</text>

  <!-- 顶部坐标 -->
  <text x="40" y="25" font-family="Courier New" font-size="11" fill="#0a0a0a" opacity="0.7">53.7346,10.1648  /  78.6518,16.4017  /  59.9886,6.2643  /  46.0312,12.7704  /  54.2144,8.7567</text>

  <!-- 底部坐标 -->
  <text x="40" y="185" font-family="Courier New" font-size="11" fill="#0a0a0a" opacity="0.7">{ XML }.CHESS — DATA 80% : BIOLOGICAL 20% — bridging_art × engineering</text>

  <!-- 旋转星芒 -->
  <g transform="translate(80,100)">
    <path d="M0,-22 L5,-5 L22,0 L5,5 L0,22 L-5,5 L-22,0 L-5,-5 Z" fill="#F2EFEA">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(1320,100)">
    <path d="M0,-22 L5,-5 L22,0 L5,5 L0,22 L-5,5 L-22,0 L-5,-5 Z" fill="#0a0a0a">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 黑色小标签 -->
  <rect x="180" y="80" width="60" height="40" fill="#0a0a0a"/>
  <text x="210" y="105" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="14" fill="#F2EFEA">[+]</text>

  <rect x="1160" y="80" width="60" height="40" fill="#0a0a0a"/>
  <text x="1190" y="105" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="14" fill="#F2EFEA">[*]</text>
</svg>
